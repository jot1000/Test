name: Kite-Benachrichtigung

on:
  schedule:
    # Ein Lauf pro Tag, 03:30 UTC. GitHub startet geplante Läufe unter Last
    # regelmässig ~2 h zu spät, deshalb bewusst früh angesetzt: die Meldung
    # trifft real zwischen ca. 05:30 und 07:30 Europe/Zurich ein (Sommerzeit).
    # --guard-window verhindert nur noch, dass eine extrem verzögerte
    # Morgenmeldung erst mittags rausgeht.
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Prognose prüfen und ggf. Telegram senden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manueller Start: immer eine Nachricht senden (Bot-Test),
            # auch wenn kein Kite-Fenster prognostiziert ist
            python notify.py --always
          else
            python notify.py --guard-window 4-11
          fi
