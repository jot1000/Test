name: Statistik aktualisieren

on:
  schedule:
    - cron: "15 3 1 * *" # monatlich am 1., 03:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: data/cache
          key: openmeteo-cache-${{ github.run_id }}
          restore-keys: openmeteo-cache-
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Analyse Sempachersee
        run: python analyse.py --spot sempach
      - name: Analyse Comersee
        run: python analyse.py --spot comer
      - name: Statistikdateien committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json stats_comer.json
          git diff --cached --quiet && echo "Keine Änderung" && exit 0
          git commit -m "Statistik aktualisieren ($(date -u +%F))"
          # Falls main inzwischen weitergewandert ist: einrebasen statt scheitern
          git pull --rebase origin main
          git push
