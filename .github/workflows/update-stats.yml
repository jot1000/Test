name: Statistik aktualisieren

on:
  schedule:
    - cron: "15 3 1 * *" # monatlich am 1., 03:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: openmeteo-cache-${{ github.run_id }}
          restore-keys: openmeteo-cache-
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Analyse laufen lassen
        run: python analyse.py
      - name: stats.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet && echo "Keine Änderung" && exit 0
          git commit -m "stats.json aktualisieren ($(date -u +%F))"
          git push
